<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>실기 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --ink:#1B1917; --ink-2:#242120; --ink-25:#2C2825; --ink-3:#332F2C; --line:#403A35;
  --paper:#F4EFE6; --paper-2:#A2988C; --paper-3:#6B635B;
  --flag:#E8B44A;
  --g1:#5B7FB0; --g2:#3F8F86; --g3:#C99043; --g4:#B85440; --g5:#7E5A7C;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --kr:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#0E0D0C;color:var(--paper);font-family:var(--kr);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;color:inherit;font-size:16px;background:none;border:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@keyframes softpulse{0%,100%{opacity:.35}50%{opacity:1}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ═══════════════════ TV 모드 ═══════════════════ */
#tv{display:none;position:fixed;inset:0;background:#000}
body.mode-tv #tv{display:block}
.canvas{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;
  background:var(--ink);display:flex;flex-direction:column;overflow:hidden}
body.tv-done .canvas{background:var(--ink-2)}

.frame{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6}
.frame.amber{border:10px solid var(--flag);opacity:.55;
  box-shadow:inset 0 0 160px rgba(232,180,74,.18)}
.frame.red{border:8px solid var(--g4);opacity:.35}

.tv-body{flex:1;display:flex;flex-direction:column;padding:80px 80px 0;min-height:0}

.tv-head{display:flex;justify-content:space-between;align-items:flex-start;
  transition:opacity .4s}
body.tv-notice .tv-head{opacity:.55}
body.tv-paused .tv-head{opacity:.4}
.tv-head .left{display:flex;align-items:center;gap:22px}
.tv-head .sq{width:26px;height:26px;background:var(--paper-3)}
.tv-head .nm{font-size:66px;font-weight:800;letter-spacing:-.02em}
.tv-head .sleft{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--paper-2);
  font-variant-numeric:tabular-nums}
.tv-head .right{text-align:right;display:flex;flex-direction:column;gap:6px}
.tv-head .rlbl{font-size:28px;font-weight:700;color:var(--paper-3)}
.tv-head .rval{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--paper-2);
  font-variant-numeric:tabular-nums}

.tv-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tv-eyebrow{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:.34em;
  color:var(--paper-3)}
.tv-clock{font-family:var(--mono);font-size:330px;font-weight:800;line-height:.92;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:font-size .35s,color .35s}
body.tv-notice .tv-clock{font-size:236px;color:var(--paper-2)}
body.tv-paused .tv-clock{color:var(--paper-3)}
body.tv-warn10 .tv-clock{color:var(--flag)}
body.tv-warn10 .tv-eyebrow{display:none}

.tv-warnline{font-size:44px;font-weight:800;color:var(--flag);display:none;margin-top:14px}
body.tv-warn10 .tv-warnline{display:block}
.tv-warnpill{display:none;align-items:center;gap:20px;background:var(--g4);color:var(--paper);
  padding:14px 34px;font-size:44px;font-weight:800;margin-top:22px}
.tv-warnpill .dot{width:18px;height:18px;border-radius:50%;background:var(--paper);
  animation:softpulse 2.4s ease-in-out infinite}
body.tv-warn3 .tv-warnpill{display:flex}
body.tv-warn3 .tv-eyebrow{display:none}

.tv-pause{display:none;align-items:center;gap:22px;color:var(--flag);margin-bottom:26px}
.tv-pause .bars{display:flex;gap:9px}
.tv-pause .bars i{width:16px;height:44px;background:var(--flag);display:block}
.tv-pause .t{font-size:48px;font-weight:800;letter-spacing:-.01em}
body.tv-paused .tv-pause{display:flex}
body.tv-paused .tv-eyebrow{visibility:hidden}

.tv-done{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:80px}
body.tv-done .tv-done{display:flex}
body.tv-done .tv-body{display:none}
.tv-done .big{font-size:120px;font-weight:800;letter-spacing:-.03em}
.tv-done .z{font-family:var(--mono);font-size:200px;font-weight:800;line-height:.9;
  color:var(--paper-3);font-variant-numeric:tabular-nums}
.tv-done .stats{display:flex;gap:56px;margin-top:20px;font-family:var(--mono);font-size:34px;
  font-weight:700;color:var(--paper-2);font-variant-numeric:tabular-nums}
.tv-done .stats .sep{color:var(--line)}

.tv-start{display:none;margin-top:40px;background:var(--paper);color:var(--ink);
  font-size:44px;font-weight:800;padding:26px 90px}
body.tv-idle .tv-start{display:block}
body.tv-idle .tv-eyebrow::after{content:''}

.tv-strip{padding:0 0 44px;transition:opacity .4s}
body.tv-paused .tv-strip{opacity:.75}
body.tv-done .tv-strip{opacity:.5}
body.tv-notice .tv-strip{opacity:0}

.tv-ctl{position:absolute;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
  z-index:8;transition:opacity .3s,transform .3s;background:var(--line);padding:1px}
.tv-ctl.hid{opacity:0;transform:translateX(-50%) translateY(-16px);pointer-events:none}
.tv-ctl button{background:var(--ink-2);color:var(--paper-2);font-size:22px;font-weight:700;
  padding:14px 26px}
.tv-ctl button:hover{background:var(--ink-3);color:var(--paper)}

/* 공지 배너 (TV) */
.tv-banner{position:absolute;left:0;right:0;bottom:0;background:var(--flag);color:var(--ink);
  padding:44px 80px 52px;display:flex;align-items:center;gap:44px;z-index:7;
  transform:translateY(101%);transition:transform .36s cubic-bezier(.16,1,.3,1)}
.tv-banner.show{transform:translateY(0)}
.tv-banner .meta{display:flex;flex-direction:column;gap:6px;flex-shrink:0;
  border-right:3px solid rgba(27,25,23,.25);padding-right:44px}
.tv-banner .k{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:.2em}
.tv-banner .t{font-family:var(--mono);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.tv-banner .msg{font-size:64px;font-weight:800;line-height:1.22;letter-spacing:-.025em;flex:1;
  text-wrap:pretty}

/* ─── 눈금자 바 ─── */
.rb-flags{position:relative;height:48px}
.rb-flag{position:absolute;bottom:0;transform:translateX(-50%);display:flex;
  flex-direction:column;align-items:center;transition:opacity .4s}
.rb-flag .lbl{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--flag);
  margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rb-flag .tag{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;
  border-bottom:13px solid var(--flag);margin-bottom:-1px}
.rb-flag .stem{width:2px;height:14px;background:var(--flag);opacity:.5}
.rb-flag.auto .lbl{display:none}
.rb-flag.auto .tag{border-left-width:7px;border-right-width:7px;border-bottom-width:9px;
  border-bottom-color:var(--paper-3)}
.rb-flag.auto .stem{background:var(--paper-3);opacity:.3}
.rb-flag.past{opacity:.25}

.rb-bar{position:relative;display:flex;height:116px;overflow:hidden}
.rb-seg{position:relative;overflow:hidden;border-right:2px solid var(--ink)}
.rb-seg:last-child{border-right:none}
.rb-seg .bg{position:absolute;inset:0;opacity:.19}
.rb-seg .fill{position:absolute;top:0;bottom:0;left:0;width:0}
.rb-seg .txt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 20px;gap:3px}
.rb-seg .sn{font-size:30px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rb-seg .st{font-family:var(--mono);font-size:19px;font-weight:700;opacity:.6;
  font-variant-numeric:tabular-nums}
.rb-seg.done .txt{opacity:.42}
.rb-head{position:absolute;top:0;bottom:0;width:4px;background:var(--paper);
  box-shadow:0 0 18px rgba(244,239,230,.75);pointer-events:none;z-index:3}
.rb-ruler{position:relative;height:26px;margin-top:4px}
.rb-tick{position:absolute;top:0;width:2px;background:var(--line)}
.rb-tick.m10{height:5px}
.rb-tick.m30{height:10px}
.rb-tick.h{height:14px;background:var(--paper-3)}
.rb-tick .tl{position:absolute;top:15px;left:0;transform:translateX(-50%);font-family:var(--mono);
  font-size:15px;font-weight:700;color:var(--paper-3)}

/* ═══════════════════ 모바일 ═══════════════════ */
#mob{display:none;position:fixed;inset:0;background:var(--ink);flex-direction:column}
body.mode-phone #mob{display:flex}
.mscreen{display:none;flex:1;flex-direction:column;min-height:0;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom))}
.mscreen.on{display:flex}

.m-top{display:flex;justify-content:space-between;align-items:center;flex:none}
.m-top .ttl{font-size:20px;font-weight:800;letter-spacing:-.02em}
.m-gear{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  margin-right:-10px}

.m-total{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 10px;flex:none}
.m-total .k{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.3em;color:var(--paper-3)}
.m-total .v{font-family:var(--mono);font-size:76px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}

.m-listhead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;font-weight:700;color:var(--paper-3);letter-spacing:.04em;margin-bottom:7px}
.m-listhead .r{font-size:12px}

.m-list{display:flex;flex-direction:column;gap:7px;flex:1;overflow-y:auto;min-height:0;
  -webkit-overflow-scrolling:touch}
.m-row{display:flex;align-items:center;gap:10px;background:var(--ink-2);padding:10px 12px;flex:none}
.m-row.dragging{background:var(--ink-25);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.m-row.dragging .hbar{background:var(--paper-2)!important}
.handle{display:flex;flex-direction:column;gap:3px;padding:6px 2px;touch-action:none;flex:none}
.handle .hbar{width:15px;height:2px;background:var(--paper-3)}
.m-row .cbar{width:6px;height:32px;flex:none}
.m-row .nmi{flex:1;font-size:17px;font-weight:700;border-bottom:1px dashed var(--line);
  padding:3px 0;min-width:0}
.m-row .nmi:focus{outline:none;border-bottom-color:var(--paper-2)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:30px;height:32px;background:var(--ink-3);color:var(--paper-2);
  font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--line)}
.stepper .n{width:44px;height:32px;background:var(--ink-3);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:16px;font-weight:800;
  font-variant-numeric:tabular-nums}

.m-add{border:1px dashed var(--line);padding:11px;text-align:center;font-size:14px;
  font-weight:700;color:var(--paper-3);width:100%;flex:none}
.m-add:active{color:var(--paper);border-color:var(--paper-3)}

.m-foot{display:flex;flex-direction:column;gap:12px;flex:none;padding-top:16px}
.m-go{height:64px;background:var(--paper);color:var(--ink);display:flex;align-items:center;
  justify-content:center;font-size:21px;font-weight:800;width:100%}
.m-go:active{opacity:.8}
.m-hint{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;
  font-weight:700;color:var(--paper-3)}

/* 실행 (세로) */
.m-runtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;
  font-weight:700;color:var(--paper-3);flex:none}
.m-runtop .el{font-family:var(--mono);color:var(--paper-2);font-variant-numeric:tabular-nums}
.m-clockwrap{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;flex:none}
.m-clockwrap .k{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.3em;
  color:var(--paper-3)}
.m-clock{font-family:var(--mono);font-size:72px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;transition:color .35s}
.m-clock.warn{color:var(--flag)}

.m-cur{background:var(--ink-2);border-left:6px solid var(--paper-3);padding:16px 18px;
  display:flex;flex-direction:column;gap:10px;flex:none;margin-top:20px}
.m-cur .r1{display:flex;justify-content:space-between;align-items:baseline}
.m-cur .cn{font-size:24px;font-weight:800}
.m-cur .ct{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--paper-2);
  font-variant-numeric:tabular-nums}
.m-cur .track{height:8px;background:var(--ink-3)}
.m-cur .track i{display:block;height:100%;width:0;background:var(--paper-3)}
.m-cur .r2{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;
  color:var(--paper-3)}
.m-cur .r2 div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.m-steps{flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;
  margin-top:20px}
.m-step{display:flex;align-items:center;gap:12px;padding:11px 14px;flex:none}
.m-step .cbar{width:6px;height:26px;flex:none}
.m-step .nm{flex:1;font-size:15px;font-weight:700}
.m-step .st{font-family:var(--mono);font-size:14px;color:var(--paper-3)}
.m-step.past{opacity:.45}
.m-step.past .nm{text-decoration:line-through}
.m-step.next .nm{color:var(--paper-2)}
.m-step.now{background:var(--ink-3);padding:13px 14px}
.m-step.now .cbar{height:30px}
.m-step.now .nm{font-size:17px;font-weight:800}
.m-badge{display:flex;align-items:center;gap:7px;color:var(--paper);padding:5px 10px;
  font-size:13px;font-weight:800}
.m-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--paper);
  animation:softpulse 2.4s ease-in-out infinite}

.m-btns{display:flex;gap:12px;flex:none;padding-top:16px}
.m-btns .main{flex:2;height:68px;background:var(--ink-3);display:flex;align-items:center;
  justify-content:center;gap:10px;font-size:19px;font-weight:800}
.m-btns .main .bars{display:flex;gap:5px}
.m-btns .main .bars i{width:6px;height:20px;background:var(--paper);display:block}
.m-btns .sub{flex:1;height:68px;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:17px;font-weight:700;color:var(--paper-2)}

.m-dim{transition:opacity .3s}
body.m-notice .m-dim{opacity:.25}

.m-card{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  background:var(--flag);color:var(--ink);padding:22px 22px 20px;display:flex;flex-direction:column;
  gap:14px;box-shadow:0 -20px 60px rgba(0,0,0,.55);z-index:9;
  transform:translateY(calc(100% + 30px));transition:transform .34s cubic-bezier(.16,1,.3,1)}
.m-card.show{transform:translateY(0)}
.m-card .r1{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.2em}
.m-card .r1 .cd{opacity:.6;letter-spacing:.06em}
.m-card .msg{font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-.02em;text-wrap:pretty}
.m-card .ok{height:52px;background:rgba(27,25,23,.12);display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:800;width:100%;color:var(--ink)}

/* 설정 */
.m-tabs{display:flex;border:1px solid var(--line);flex:none;margin-bottom:2px}
.m-tabs button{flex:1;padding:11px 0;font-size:14px;font-weight:700;color:var(--paper-2)}
.m-tabs button.on{background:var(--ink-3);color:var(--paper);font-weight:800}
.m-pane{display:none;flex:1;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;
  padding-top:14px}
.m-pane.on{display:flex}
.m-secline{display:flex;justify-content:space-between;font-size:12px;font-weight:700;
  color:var(--paper-3);letter-spacing:.06em;flex:none}
.m-min{background:var(--ink-3);padding:7px 10px;font-family:var(--mono);font-size:15px;
  font-weight:700;width:52px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.m-x{font-size:18px;color:var(--paper-3);padding:4px 2px 4px 6px;flex:none}

.n-card{display:flex;flex-direction:column;gap:9px;background:var(--ink-2);padding:12px;flex:none}
.n-card .r1{display:flex;align-items:center;gap:8px}
.n-basis{background:var(--ink-3);padding:6px 10px;font-size:13px;font-weight:700;flex:none}
.n-min{background:var(--ink-3);padding:6px 10px;font-family:var(--mono);font-size:14px;
  font-weight:700;width:56px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.n-arrow{font-size:13px;color:var(--paper-3);flex:none}
.n-at{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--flag);flex:1;
  font-variant-numeric:tabular-nums}
.n-at.bad{color:var(--g4)}
.n-txt{background:var(--ink-3);padding:10px 12px;font-size:15px;font-weight:700;width:100%}

.o-row{display:flex;align-items:center;gap:11px;padding:13px 0;font-size:15px;
  border-bottom:1px solid rgba(64,58,53,.55);flex:none}
.o-row:last-child{border-bottom:none}
.o-row label{flex:1}
.o-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--flag);flex:none}
.o-num{width:56px;background:var(--ink-3);padding:8px;text-align:center;font-family:var(--mono);
  font-weight:700;flex:none}
.o-txt{flex:1;background:var(--ink-3);padding:9px 11px;font-size:15px;font-weight:700;min-width:0}
.o-note{font-size:12px;color:var(--paper-3);flex:none}
.seg-pick{display:flex;border:1px solid var(--line);flex:none}
.seg-pick button{padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--paper-3)}
.seg-pick button.on{background:var(--paper);color:var(--ink)}
.m-done-sum{display:flex;flex-direction:column;gap:6px;background:var(--ink-2);padding:18px;
  font-family:var(--mono);font-size:15px;color:var(--paper-2);flex:none;margin-top:20px;
  font-variant-numeric:tabular-nums}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body class="mode-phone">

<!-- ══════════════ TV ══════════════ -->
<div id="tv">
<div class="canvas" id="canvas">
  <div class="frame" id="frame"></div>

  <div class="tv-ctl" id="tvCtl">
    <button id="tvMain">일시정지</button>
    <button id="tvReset">처음으로</button>
    <button id="tvFull">전체화면</button>
  </div>

  <div class="tv-body">
    <div class="tv-head">
      <div class="left">
        <div class="sq" id="tvSq"></div>
        <div class="nm" id="tvNm">시작 전</div>
        <div class="sleft" id="tvSleft"></div>
      </div>
      <div class="right">
        <div class="rlbl" id="tvRlbl">다음 안내</div>
        <div class="rval" id="tvRval">—</div>
      </div>
    </div>

    <div class="tv-center">
      <div class="tv-pause"><div class="bars"><i></i><i></i></div><div class="t">일시정지</div></div>
      <div class="tv-eyebrow" id="tvEyebrow">REMAINING</div>
      <div class="tv-clock" id="tvClock">4:00:00</div>

<script>
'use strict';
/*!ver:2026-08-10b*/
/* ─────────────────────────────────────────────
   배포할 때마다 아래 VERSION 값과 위 주석의 ver: 값을
   똑같이 바꾸세요. 두 값이 서버와 다르면 앱이 스스로
   새 버전을 감지해서 다시 불러옵니다.
   ───────────────────────────────────────────── */
const VERSION='2026-08-10b';

async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/\/\*!ver:([^*]+)\*\//);
    if(!m||m[1]===VERSION)return;
    if(R.status==='running'||R.status==='paused')return; // 진행 중엔 건드리지 않는다
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }catch(e){}
}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const d=document.createElement(t);if(c)d.className=c;if(h!=null)d.innerHTML=h;return d};
const GC=['--g1','--g2','--g3','--g4','--g5'];
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color=i=>cvar(GC[i%5]);

const DEFAULT={
  title:'실기 타이머',
  stages:[{name:'스케치',min:40},{name:'밑색',min:90},
          {name:'묘사',min:90},{name:'마무리',min:20}],
  notices:[
    {basis:'left',min:60,text:'1시간 남았습니다'},
    {basis:'left',min:30,text:'30분 남았습니다'},
    {basis:'left',min:10,text:'10분 남았습니다'}],
  opts:{autoStage:true,noticeSec:20,sound:true,vib:true,
        display:'auto',bgMode:'auto'}
};

let S=hydrate(load('sg_settings'));
let R={status:'idle',base:0,resumedAt:0,pauseCount:0,pausedMs:0,pauseStart:0,noticeCount:0};
let cues=[],queue=[],noticeTimer=null,noticeEnd=0,wakeLock=null,ac=null,raf=null,ctlTimer=null;
let curTab='stage';

function hydrate(v){
  const d=JSON.parse(JSON.stringify(DEFAULT));
  if(!v)return d;
  const o=Object.assign(d.opts,v.opts||{});
  if(typeof o.bg==='boolean'){o.bgMode=o.bg?'auto':'off';delete o.bg}
  if(['auto','always','off'].indexOf(o.bgMode)<0)o.bgMode='auto';
  return{title:v.title||d.title,stages:(v.stages&&v.stages.length)?v.stages:d.stages,
         notices:v.notices||d.notices,opts:o};
}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const persist=()=>store('sg_settings',S);

const totalMin=()=>S.stages.reduce((a,s)=>a+(+s.min||0),0);
const totalMs=()=>totalMin()*60000;
function fmt(ms){
  ms=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60,p=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`;
}
function fmtMin(min){
  const h=Math.floor(min/60),m=Math.round(min%60);
  return h>0?`${h}:${String(m).padStart(2,'0')}`:`0:${String(m).padStart(2,'0')}`;
}
const elapsed=()=>R.status==='running'?R.base+(Date.now()-R.resumedAt):R.base;
const cueTime=n=>n.basis==='elapsed'?n.min*60000:totalMs()-n.min*60000;

/* ══════ 모드 ══════ */
function isTv(){
  if(S.opts.display==='tv')return true;
  if(S.opts.display==='phone')return false;
  return window.innerWidth>window.innerHeight;
}
/* 실행 상태에 맞는 모바일 화면을 맞춰둔다.
   가로에서 시작한 뒤 세로로 돌려도 이어지도록. */
function syncScreen(){
  if($('#mSet').classList.contains('on'))return;
  const want=R.status==='idle'?'mHome':'mRun';
  if(!$('#'+want).classList.contains('on'))showScreen(want);
}
function layout(){
  const tv=isTv();
  document.body.classList.toggle('mode-tv',tv);
  document.body.classList.toggle('mode-phone',!tv);
  if(tv)$('#canvas').style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));
  syncScreen();
  pokeCtl();
  cancelAnimationFrame(raf);frame();
}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,180));

function pokeCtl(){
  const c=$('#tvCtl');c.classList.remove('hid');clearTimeout(ctlTimer);
  if(isTv()&&R.status==='running')ctlTimer=setTimeout(()=>c.classList.add('hid'),3500);
}
['pointerdown','pointermove','keydown'].forEach(e=>addEventListener(e,pokeCtl,{passive:true}));

/* ══════ 큐 ══════ */
function buildCues(){
  const list=[],tot=totalMs();
  S.notices.forEach(n=>{
    const t=cueTime(n);
    if(t>=0&&t<=tot&&n.text.trim())list.push({t,text:n.text.trim(),kind:'user'});
  });
  let acc=0;
  S.stages.forEach((st,i)=>{
    const d=st.min*60000;
    if(S.opts.autoStage&&i>0)list.push({t:acc,text:`${st.name} 단계 시작`,kind:'auto'});
    acc+=d;
  });
  list.sort((a,b)=>a.t-b.t);list.forEach(c=>c.fired=false);cues=list;
}
function stageAt(ms){
  let acc=0;
  for(let i=0;i<S.stages.length;i++){
    const d=S.stages[i].min*60000;
    if(ms<acc+d)return{i,start:acc,end:acc+d,st:S.stages[i]};
    acc+=d;
  }
  const i=Math.max(0,S.stages.length-1);
  return{i,start:acc,end:acc,st:S.stages[i]||{name:'—',min:0}};
}

/* ══════ 눈금자 바 ══════ */
function buildRuler(){
  const bar=$('#rbBar');
  [...bar.querySelectorAll('.rb-seg')].forEach(e=>e.remove());
  const tm=totalMin()||1;let acc=0;
  S.stages.forEach((st,i)=>{
    const d=el('div','rb-seg');d.style.flex=(st.min/tm)+' 0 0';
    const c=color(i);
    d.innerHTML=`<div class="bg" style="background:${c}"></div>
      <div class="fill" style="background:${c}"></div>
      <div class="txt"><div class="sn"></div><div class="st">${fmtMin(acc)}</div></div>`;
    d.querySelector('.sn').textContent=st.name;
    bar.insertBefore(d,$('#rbHead'));acc+=st.min;
  });
  const rl=$('#rbRuler');rl.innerHTML='';
  for(let m=0;m<=tm;m+=10){
    const isH=m%60===0,is30=m%30===0;
    const t=el('div','rb-tick '+(isH?'h':is30?'m30':'m10'));
    t.style.left=(m/tm*100)+'%';
    if(isH&&m>0&&m<tm)t.innerHTML=`<span class="tl">${m/60}h</span>`;
    rl.appendChild(t);
  }
  const fl=$('#rbFlags');fl.innerHTML='';
  const tot=totalMs()||1;
  cues.forEach(c=>{
    const f=el('div','rb-flag'+(c.kind==='auto'?' auto':''));
    f.style.left=(c.t/tot*100)+'%';f.title=c.text;
    f.innerHTML=`<div class="lbl">${fmt(c.t)}</div><div class="tag"></div><div class="stem"></div>`;
    fl.appendChild(f);
  });
}

/* ══════ 정렬(드래그) ══════ */
function sortable(box,onDone){
  box.querySelectorAll('.handle').forEach(h=>{
    h.onpointerdown=ev=>{
      ev.preventDefault();
      const row=h.closest('[data-i]');if(!row)return;
      const snapshot=S.stages.slice();
      row.classList.add('dragging');
      h.setPointerCapture(ev.pointerId);
      const move=e2=>{
        const y=e2.clientY;let after=null;
        [...box.querySelectorAll('[data-i]')].forEach(s=>{
          if(s===row)return;
          const b=s.getBoundingClientRect();
          if(y>b.top+b.height/2)after=s;
        });
        if(after)after.after(row);else box.prepend(row);
      };
      const up=()=>{
        h.onpointermove=null;h.onpointerup=null;h.onpointercancel=null;
        row.classList.remove('dragging');
        const order=[...box.querySelectorAll('[data-i]')].map(r=>+r.dataset.i);
        S.stages=order.map(i=>snapshot[i]);
        persist();onDone();
      };
      h.onpointermove=move;h.onpointerup=up;h.onpointercancel=up;
    };
  });
}
const handleHTML='<div class="handle"><div class="hbar"></div><div class="hbar"></div><div class="hbar"></div></div>';

/* ══════ 홈(B1) ══════ */
function renderHome(){
  $('#hTitle').textContent=S.title||'실기 타이머';
  $('#hTotal').textContent=fmt(totalMs());
  $('#hCount').textContent=`단계 ${S.stages.length} · 공지 ${S.notices.filter(n=>n.text.trim()).length}`;
  const box=$('#hList');box.innerHTML='';
  S.stages.forEach((st,i)=>{
    const r=el('div','m-row');r.dataset.i=i;
    r.innerHTML=handleHTML+
      `<div class="cbar" style="background:${color(i)}"></div>
       <input class="nmi" value="">
       <div class="stepper"><button class="mi">−</button><div class="n">${st.min}</div><button class="pl">+</button></div>`;
    r.querySelector('.nmi').value=st.name;
    r.querySelector('.nmi').oninput=e=>{st.name=e.target.value;persist();buildRuler()};
    r.querySelector('.mi').onclick=()=>{st.min=Math.max(5,st.min-5);persist();syncAll()};
    r.querySelector('.pl').onclick=()=>{st.min=Math.min(600,st.min+5);persist();syncAll()};
    box.appendChild(r);
  });
  sortable(box,syncAll);
}
$('#hAdd').onclick=()=>{S.stages.push({name:'새 단계',min:30});persist();syncAll()};
$('#hGear').onclick=()=>showScreen('mSet');
$('#hGo').onclick=()=>{showScreen('mRun');start()};

/* ══════ 설정(C) ══════ */
function renderSetStage(){
  $('#sStageN').textContent=`단계 ${S.stages.length}개`;
  $('#sStageSum').textContent=`합계 ${fmt(totalMs())}`;
  const box=$('#sList');box.innerHTML='';
  S.stages.forEach((st,i)=>{
    const r=el('div','m-row');r.dataset.i=i;
    r.innerHTML=handleHTML+
      `<div class="cbar" style="background:${color(i)};height:30px"></div>
       <input class="nmi" style="border-bottom:none">
       <input class="m-min" inputmode="numeric" value="${st.min}">
       <div style="font-size:13px;color:var(--paper-3)">분</div>
       <button class="m-x">✕</button>`;
    r.querySelector('.nmi').value=st.name;
    r.querySelector('.nmi').oninput=e=>{st.name=e.target.value;persist();buildRuler()};
    r.querySelector('.m-min').oninput=e=>{
      st.min=Math.max(1,+e.target.value||1);persist();
      $('#sStageSum').textContent=`합계 ${fmt(totalMs())}`;buildCues();buildRuler();renderNotices()};
    r.querySelector('.m-x').onclick=()=>{
      if(S.stages.length<=1)return;S.stages.splice(i,1);persist();syncAll()};
    box.appendChild(r);
  });
  sortable(box,syncAll);
}
$('#sAdd').onclick=()=>{S.stages.push({name:'새 단계',min:30});persist();syncAll()};

function renderNotices(){
  $('#sNoticeN').textContent=`공지 ${S.notices.length}개`;
  const box=$('#nList');box.innerHTML='';
  S.notices.forEach((n,i)=>{
    const c=el('div','n-card');
    c.innerHTML=`<div class="r1">
        <button class="n-basis"></button>
        <input class="n-min" inputmode="numeric" value="${n.min}">
        <div class="n-arrow">분 →</div>
        <div class="n-at"></div>
        <button class="m-x">✕</button>
      </div>
      <input class="n-txt" placeholder="화면에 띄울 문구">`;
    const bs=c.querySelector('.n-basis'),at=c.querySelector('.n-at');
    const upd=()=>{
      bs.textContent=n.basis==='elapsed'?'경과':'잔여';
      const t=cueTime(n);
      if(t<0||t>totalMs()){at.textContent='범위 밖';at.classList.add('bad')}
      else{at.textContent=fmt(t);at.classList.remove('bad')}
    };
    upd();
    c.querySelector('.n-txt').value=n.text;
    bs.onclick=()=>{n.basis=n.basis==='elapsed'?'left':'elapsed';persist();upd();buildCues();buildRuler()};
    c.querySelector('.n-min').oninput=e=>{n.min=Math.max(0,+e.target.value||0);persist();upd();buildCues();buildRuler()};
    c.querySelector('.n-txt').oninput=e=>{n.text=e.target.value;persist();buildCues();buildRuler()};
    c.querySelector('.m-x').onclick=()=>{S.notices.splice(i,1);persist();buildCues();buildRuler();renderNotices();renderHome()};
    box.appendChild(c);
  });
}
$('#nAdd').onclick=()=>{S.notices.push({basis:'left',min:15,text:''});persist();renderNotices();buildCues();buildRuler()};

function renderOpts(){
  $('#oTitle').value=S.title||'';
  $('#oSound').checked=S.opts.sound;$('#oVib').checked=S.opts.vib;
  [...$('#oBgMode').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.opts.bgMode));
  $('#oBgNote').textContent={
    auto:'화면이 꺼질 때만 오디오를 잡습니다. 화면을 켜둔 동안에는 음악 앱과 같이 쓸 수 있습니다.',
    always:'시작할 때부터 오디오를 잡습니다. 가장 확실하지만 음악 앱이 멈춥니다.',
    off:'백그라운드 유지를 하지 않습니다. 화면이 꺼지면 공지 알림이 오지 않습니다.'
  }[S.opts.bgMode]||'';
  $('#oStage').checked=S.opts.autoStage;$('#oSec').value=S.opts.noticeSec;
  [...$('#oDisp').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.opts.display));
}
$('#oTitle').oninput=e=>{S.title=e.target.value;persist();renderHome()};
$('#oSound').onchange=e=>{S.opts.sound=e.target.checked;persist()};
$('#oVib').onchange=e=>{S.opts.vib=e.target.checked;persist()};
$('#oBgMode').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  S.opts.bgMode=b.dataset.v;persist();renderOpts();
  if(R.status==='running')S.opts.bgMode==='always'?keeperPlay(true):keeperPlay(false);
};
$('#oStage').onchange=e=>{S.opts.autoStage=e.target.checked;persist();buildCues();buildRuler()};
$('#oSec').oninput=e=>{const v=+e.target.value;if(v>=3&&v<=120){S.opts.noticeSec=v;persist()}};
$('#oSec').onblur=e=>{S.opts.noticeSec=Math.min(120,Math.max(3,+e.target.value||20));
  e.target.value=S.opts.noticeSec;persist()};
$('#oDisp').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  S.opts.display=b.dataset.v;persist();renderOpts();layout()};

$('#sTabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  curTab=b.dataset.t;
  [...$('#sTabs').children].forEach(x=>x.classList.toggle('on',x===b));
  $('#paneStage').classList.toggle('on',curTab==='stage');
  $('#paneNotice').classList.toggle('on',curTab==='notice');
  $('#paneOpt').classList.toggle('on',curTab==='opt');
};
$('#sBack').onclick=()=>showScreen(R.status==='idle'?'mHome':'mRun');

/* ══════ 실행 렌더 ══════ */
function renderSteps(){
  const box=$('#rSteps');box.innerHTML='';
  const e=Math.min(elapsed(),totalMs());
  let acc=0;
  S.stages.forEach((st,i)=>{
    const d=st.min*60000,c=color(i);
    const done=e>=acc+d,now=!done&&e>=acc&&R.status!=='idle';
    const r=el('div','m-step '+(done?'past':now?'now':'next'));
    if(now)r.style.outline='1px solid '+c;
    r.innerHTML=`<div class="cbar" style="background:${c}"></div>
      <div class="nm"></div>`;
    r.querySelector('.nm').textContent=st.name;
    if(done)r.appendChild(el('div','st','완료'));
    else if(now){
      const b=el('div','m-badge','<div class="dot"></div><div>진행 중</div>');
      b.style.background=c;r.appendChild(b);
    }else r.appendChild(el('div','st',st.min+'분'));
    box.appendChild(r);acc+=d;
  });
}

function frame(){
  const tot=totalMs(),e=Math.min(elapsed(),tot),left=tot-e;
  const running=R.status==='running',idle=R.status==='idle',done=R.status==='done';
  const cur=stageAt(Math.min(e,Math.max(0,tot-1)));
  const nxt=cues.find(c=>c.t>e);
  const w10=!idle&&!done&&left<=600000&&left>180000;
  const w3=!idle&&!done&&left<=180000;

  document.body.classList.toggle('tv-idle',idle);
  document.body.classList.toggle('tv-paused',R.status==='paused');
  document.body.classList.toggle('tv-done',done);
  document.body.classList.toggle('tv-warn10',w10);
  document.body.classList.toggle('tv-warn3',w3);
  $('#frame').className='frame'+(document.body.classList.contains('tv-notice')?' amber':w3?' red':'');

  if(isTv()){
    $('#tvClock').textContent=fmt(left);
    $('#tvNm').textContent=idle?'시작 전':cur.st.name;
    $('#tvSq').style.background=idle?cvar('--paper-3'):color(cur.i);
    $('#tvSleft').textContent=idle?`총 ${fmt(tot)}`:fmt(cur.end-e)+' 남음';
    if(R.status==='paused'){$('#tvRlbl').textContent='';$('#tvRval').textContent='PAUSED'}
    else{$('#tvRlbl').textContent='다음 안내';
      $('#tvRval').textContent=idle?'—':nxt?fmt(nxt.t-e)+' 후':'없음'}
    if(w10)$('#tvWarnline').textContent=`${cur.st.name} 단계 · ${Math.ceil(left/60000)}분 남음`;
    if(w3)$('#tvWarnpill').textContent=`${Math.ceil(left/60000)}분 남았습니다 · 작업 정리`;
    if(done){
      $('#dTotal').textContent='총 '+fmt(tot);
      $('#dNotice').textContent='공지 '+R.noticeCount+'회';
      $('#dPause').textContent=R.pauseCount?`정지 ${R.pauseCount}회 · ${fmt(R.pausedMs)}`:'정지 없음';
    }
    const segs=$('#rbBar').querySelectorAll('.rb-seg');let acc=0;
    segs.forEach((sg,i)=>{
      const d=S.stages[i].min*60000,p=Math.max(0,Math.min(1,(e-acc)/d));
      sg.querySelector('.fill').style.width=(p*100)+'%';
      sg.classList.toggle('done',e>=acc+d);acc+=d;
    });
    const hd=$('#rbHead');
    if(idle||done){hd.style.display='none'}
    else{hd.style.display='block';hd.style.left=`calc(${e/tot*100}% - 2px)`}
    const fl=$('#rbFlags').children;
    cues.forEach((c,i)=>{if(fl[i])fl[i].classList.toggle('past',e>=c.t)});
  }else{
    $('#rTitle').textContent=S.title||'실기 타이머';
    $('#rElapsed').textContent='경과 '+fmt(e);
    $('#rClock').textContent=fmt(left);
    $('#rClock').classList.toggle('warn',w10||w3);
    $('#rKicker').textContent=done?'FINISHED':'REMAINING';
    $('#rCur').style.display=done?'none':'flex';
    $('#rSum').style.display=done?'flex':'none';
    if(done){
      $('#rSum').innerHTML='';
      [['총 시간',fmt(tot)],['공지',R.noticeCount+'회'],
       ['정지',R.pauseCount?`${R.pauseCount}회 · ${fmt(R.pausedMs)}`:'없음']]
        .forEach(([k,v])=>$('#rSum').appendChild(el('div',null,
          `<span style="color:var(--paper-3)">${k}</span> &nbsp;${v}`)));
    }else{
      $('#rCur').style.borderLeftColor=idle?cvar('--paper-3'):color(cur.i);
      $('#rCurNm').textContent=idle?'시작 전':cur.st.name;
      $('#rCurT').textContent=idle?fmt(tot):fmt(cur.end-e);
      const p=idle?0:Math.max(0,Math.min(1,(e-cur.start)/(cur.end-cur.start||1)));
      $('#rCurBar').style.width=(p*100)+'%';
      $('#rCurBar').style.background=idle?cvar('--paper-3'):color(cur.i);
      $('#rNext').textContent=nxt?`다음 안내 ${fmt(nxt.t-e)} 후`:'예정된 안내 없음';
      $('#rNextTxt').textContent=nxt?nxt.text.slice(0,12):'';
    }
    $('#rMainT').textContent=running?'일시정지':done?'다시':R.status==='paused'?'이어서':'시작';
    $('#rMain').querySelector('.bars').style.display=running?'flex':'none';
  }

  if(running){
    if(e>=tot){finish();return}
    raf=requestAnimationFrame(frame);
  }
}

let lastStepSig='';
function refreshSteps(){
  const e=Math.min(elapsed(),totalMs());
  const sig=S.stages.map((s,i)=>stageAt(e).i).join()+R.status+S.stages.length;
  if(sig!==lastStepSig){lastStepSig=sig;renderSteps()}
}
setInterval(()=>{if(!isTv()&&$('#mRun').classList.contains('on'))refreshSteps()},900);

/* ══════ 공지 ══════ */
function fire(c){queue.push(c);R.noticeCount++;if(!noticeTimer)showNext()}
function showNext(){
  const c=queue.shift();
  if(!c){noticeTimer=null;document.body.classList.remove('tv-notice');return}
  document.body.classList.add('tv-notice');
  $('#bnMsg').textContent=c.text;$('#bnTime').textContent=fmt(c.t);
  $('#tvBanner').classList.add('show');
  $('#cdMsg').textContent=c.text;$('#cdK').textContent='NOTICE · '+fmt(c.t);
  $('#mCard').classList.add('show');
  document.body.classList.add('m-notice');
  play(c.kind==='auto'?'stage':'notice');
  buzz(c.kind==='auto'?[140]:[220,110,220]);
  noticeEnd=Date.now()+S.opts.noticeSec*1000;
  noticeTimer=setTimeout(hideNotice,S.opts.noticeSec*1000);
}
function hideNotice(){
  clearTimeout(noticeTimer);noticeTimer=null;$('#cdSec').textContent='';
  $('#tvBanner').classList.remove('show');
  $('#mCard').classList.remove('show');
  document.body.classList.remove('m-notice','tv-notice');
  if(queue.length)setTimeout(showNext,440);
}
$('#cdOk').onclick=hideNotice;
$('#tvBanner').onclick=hideNotice;

/* ══════ 오디오 ══════
   Web Audio 대신 Audio 엘리먼트를 쓴다. 아이폰의 무음 스위치는
   Web Audio를 죽이지만 Audio 엘리먼트 재생은 막지 않는다. */
function wavURL(a,rate){
  rate=rate||44100;
  const n=a.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);
  v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,a[i]))*32767,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function toneURL(fs,dur){
  const rate=44100,per=Math.round(rate*dur),a=new Float32Array(per*fs.length);
  fs.forEach((f,k)=>{for(let i=0;i<per;i++){
    const t=i/rate;a[k*per+i]=Math.sin(2*Math.PI*f*t)*Math.exp(-t*5)*.65;}});
  return wavURL(a);
}
const SND={
  notice:new Audio(toneURL([880,1175],.5)),
  stage :new Audio(toneURL([523,659,784],.34)),
  end   :new Audio(toneURL([784,659,523,392],.42))
};
/* 2초짜리 극저음량 루프. 이게 재생되는 동안 브라우저는 페이지를
   잠재우지 않으므로 화면이 꺼져도 타이머와 알림이 계속 돈다. */
const keeper=new Audio((()=>{const a=new Float32Array(88200);
  for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*1e-4;return wavURL(a)})());
keeper.loop=true;keeper.volume=.02;
let audioReady=false;

function unlockAudio(){
  if(audioReady)return;audioReady=true;
  // 아이폰 무음 스위치를 무시하고 소리가 나게 한다
  try{if('audioSession'in navigator)navigator.audioSession.type='playback'}catch(e){}
  Object.keys(SND).forEach(k=>{const a=SND[k];
    a.play().then(()=>{a.pause();a.currentTime=0}).catch(()=>{})});
  // 나중에 백그라운드에서 재생할 수 있도록 미리 한 번 틔워둔다
  keeper.play().then(()=>{if(S.opts.bgMode!=='always')keeper.pause()}).catch(()=>{});
}
function play(k){
  if(!S.opts.sound)return;
  const a=SND[k];if(!a)return;
  try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}
}
function buzz(p){if(S.opts.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function keeperPlay(on){
  try{on?keeper.play().catch(()=>{}):keeper.pause()}catch(e){}
}

async function keepAlive(on){
  if(on&&S.opts.bgMode==='always')keeperPlay(true);
  if(!on)keeperPlay(false);
  try{
    if(on){if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}

/* ══════ 잠금화면 표시 ══════ */
const artCache={};
function stageArt(i){
  if(artCache[i])return artCache[i];
  const c=document.createElement('canvas');c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#1B1917';x.fillRect(0,0,512,512);
  x.fillStyle=color(i);x.fillRect(0,400,512,112);
  x.fillStyle='#F4EFE6';x.font='800 148px Pretendard,sans-serif';
  x.textAlign='center';x.fillText('실기',256,300);
  return artCache[i]=c.toDataURL('image/png');
}
let lastMeta=0;
function updateMedia(force){
  if(!('mediaSession'in navigator))return;
  if(!force&&Date.now()-lastMeta<1000)return;
  lastMeta=Date.now();
  const tot=totalMs(),e=Math.min(elapsed(),tot),left=tot-e;
  const cur=stageAt(Math.min(e,Math.max(0,tot-1)));
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:fmt(left)+' 남음',
      artist:R.status==='paused'?'일시정지':cur.st.name+' 단계',
      album:S.title||'실기 타이머',
      artwork:[{src:stageArt(cur.i),sizes:'512x512',type:'image/png'}]
    });
    navigator.mediaSession.playbackState=R.status==='running'?'playing':'paused';
    if(navigator.mediaSession.setPositionState&&tot>0)
      navigator.mediaSession.setPositionState({
        duration:tot/1000,
        position:Math.min(e,tot)/1000,
        playbackRate:R.status==='running'?1:0});
  }catch(e){}
}
if('mediaSession'in navigator){
  try{
    navigator.mediaSession.setActionHandler('play',()=>start());
    navigator.mediaSession.setActionHandler('pause',()=>pause());
    navigator.mediaSession.setActionHandler('stop',()=>reset());
  }catch(e){}
}

/* ══════ 백그라운드 엔진 ══════
   화면이 꺼지면 requestAnimationFrame은 멈춘다. 공지 발화와
   종료 판정은 반드시 여기서 해야 한다. */
setInterval(()=>{
  if(R.status!=='running')return;
  const tot=totalMs(),e=Math.min(elapsed(),tot);
  cues.forEach(c=>{if(!c.fired&&e>=c.t){c.fired=true;fire(c)}});
  updateMedia();
  if(e>=tot)finish();
},500);

/* 공지 카드의 남은 초 — 화면 모드와 무관하게 갱신 */
setInterval(()=>{
  if(!noticeTimer)return;
  $('#cdSec').textContent=Math.max(0,Math.ceil((noticeEnd-Date.now())/1000))+'초 후 닫힘';
},250);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'){
    // 화면이 꺼지거나 앱이 가려질 때 비로소 오디오를 잡는다
    if(R.status==='running'&&S.opts.bgMode!=='off')keeperPlay(true);
  }else{
    // 돌아오면 놓아준다 — 음악 앱이 다시 재생될 수 있도록
    if(S.opts.bgMode!=='always')keeperPlay(false);
    if(R.status==='running'){keepAlive(true);cancelAnimationFrame(raf);frame()}
    updateMedia(true);
  }
});

/* ══════ 제어 ══════ */
function start(){
  if(!S.stages.length)return;
  unlockAudio();
  if(R.status==='paused'&&R.pauseStart)R.pausedMs+=Date.now()-R.pauseStart;
  buildCues();buildRuler();
  const e=elapsed();cues.forEach(c=>c.fired=c.t<=e);
  R.status='running';R.resumedAt=Date.now();R.pauseStart=0;
  saveRun();keepAlive(true);updateMedia(true);
  syncScreen();renderSteps();cancelAnimationFrame(raf);frame();
}
function pause(){
  if(R.status!=='running')return;
  R.base=elapsed();R.status='paused';R.pauseCount++;R.pauseStart=Date.now();
  cancelAnimationFrame(raf);saveRun();keepAlive(false);updateMedia(true);
  syncScreen();renderSteps();frame();
}
function reset(){
  R={status:'idle',base:0,resumedAt:0,pauseCount:0,pausedMs:0,pauseStart:0,noticeCount:0};
  cancelAnimationFrame(raf);queue=[];hideNotice();keepAlive(false);
  buildCues();buildRuler();saveRun();renderSteps();frame();
  if('mediaSession'in navigator)try{navigator.mediaSession.playbackState='none'}catch(e){}
  syncScreen();
}
function finish(){
  if(R.status==='paused'&&R.pauseStart){R.pausedMs+=Date.now()-R.pauseStart;R.pauseStart=0}
  R.base=totalMs();R.status='done';
  cancelAnimationFrame(raf);saveRun();
  play('end');buzz([400,150,400,150,400]);
  setTimeout(()=>keepAlive(false),3000);
  updateMedia(true);syncScreen();renderSteps();frame();
}
const saveRun=()=>store('sg_run',{...R,at:Date.now()});
const toggle=()=>{
  if(R.status==='running')pause();
  else if(R.status==='done'){reset();showScreen('mRun');start()}
  else start();
};
$('#rMain').onclick=toggle;
$('#tvMain').onclick=toggle;
$('#tvStart').onclick=start;
$('#rReset').onclick=()=>{if(R.status==='idle'||confirm('처음으로 되돌릴까요?'))reset()};
$('#tvReset').onclick=()=>{if(R.status==='idle'||confirm('처음으로 되돌릴까요?'))reset()};
$('#tvFull').onclick=async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else{await document.documentElement.requestFullscreen?.();
      if(isTv())await screen.orientation?.lock?.('landscape').catch(()=>{})}
  }catch(e){}
  setTimeout(layout,200);
};

function showScreen(id){
  ['mHome','mRun','mSet'].forEach(x=>$('#'+x).classList.toggle('on',x===id));
  if(id==='mRun')renderSteps();
  if(id==='mSet'){renderSetStage();renderNotices();renderOpts()}
}

document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='f'||e.key==='F')$('#tvFull').click();
  if(e.key==='Escape'&&noticeTimer)hideNotice();
});

/* ══════ 초기화 ══════ */
function syncAll(){
  buildCues();buildRuler();renderHome();
  if($('#mSet').classList.contains('on')){renderSetStage();renderNotices()}
  renderSteps();frame();
}
syncAll();renderOpts();layout();
setTimeout(checkUpdate,1500);

(function(){
  const r=load('sg_run');
  if(r&&(r.status==='running'||r.status==='paused')){
    const el2=r.status==='running'?r.base+(Date.now()-r.resumedAt):r.base;
    if(el2>0&&el2<totalMs()&&confirm(`진행 중이던 타이머가 있습니다.\n${fmt(el2)} 지난 시점부터 이어서 할까요?`)){
      R=Object.assign(R,r,{status:'paused',base:el2,resumedAt:0,pauseStart:Date.now()});
      buildCues();cues.forEach(c=>c.fired=c.t<=el2);
      showScreen('mRun');renderSteps();frame();return;
    }
  }
  store('sg_run',null);
})();
</script>
</body>
